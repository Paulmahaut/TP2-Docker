name: CI devops 2025

on:
  # launch the pipeline on every push to main and develop
  push:
    branches: [main, develop]
  # and on every pull request
  pull_request:

jobs:
  test-backend:
    # GitHub virtual machine running the job
    runs-on: ubuntu-24.04
    steps:
      # get the repository code on the runner
      - uses: actions/checkout@v4

      # install Java 21 (needed by Maven to compile the Spring API)
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # compile + run unit and integration tests (testcontainers)
      - name: Build and test with Maven
        run: mvn clean verify --file simple-api/pom.xml
